[package]
name = "rslwe"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
debug = false
strip = true
opt-level = 3


[profile.bench]
debug = true
strip = false
opt-level = 3
lto = false

[dev-dependencies]
criterion = "0.8.2"
divan = "0.1.21"
iai-callgrind = "0.16.1"

[[bench]]
name = "criterion_lwe"
harness = false

[[bench]]
name = "divan_lwe"
harness = false

[[bench]]
name = "iai_lwe"
harness = false
